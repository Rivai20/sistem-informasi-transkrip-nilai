{% extends 'base.html' %}
{% block title %}Buat Mahasiswa{% endblock %}
{% block content %}
<h3>Buat Mahasiswa Baru</h3>
<form method="post">
  <div class="mb-3"><label>NIK</label><input name="nik" class="form-control" required></div>
  <div class="mb-3"><label>Nama</label><input name="name" class="form-control" required></div>
  <div class="mb-3"><label>Password</label><input name="password" type="password" class="form-control" required></div>
  <div class="d-flex gap-2">
    <button class="btn btn-primary">Buat</button>
    <a class="btn btn-primary" href="{{ url_for('admin_dashboard') }}">Kembali</a>
  </div>
</form>
{% endblock %}
