{% extends 'base.html' %}
{% block title %}Lihat Transkrip{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center gap-3 mb-3">
  <div>
    <p class="student-kicker mb-1">Pratinjau dokumen</p>
    <h1 class="h4 mb-1">Transkrip Nilai</h1>
    <p class="text-muted mb-0">{{ transcript.filename }}</p>
  </div>
  <div class="d-flex gap-2">
    <a class="btn btn-outline-secondary" href="{{ url_for('student_dashboard') if current_user.role == 'mahasiswa' else url_for('admin_transcripts') }}">Kembali</a>
    <a class="btn btn-primary" href="{{ url_for('download_file', filename=transcript.filename) }}">Unduh</a>
  </div>
</div>
<div class="transcript-preview">
  <iframe src="{{ url_for('preview_file', filename=transcript.filename) }}" title="Pratinjau {{ transcript.filename }}"></iframe>
</div>
{% endblock %}
